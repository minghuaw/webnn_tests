<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebNN Dispatch – mul + div</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>WebNN Dispatch – mul + div</h1>
  <p>mul [1,2,3,4] * [10,10,10,10] = [10,20,30,40], then div by [2,4,5,8]. Expected: [5, 5, 6, 5] (10/2, 20/4, 30/5, 40/8).</p>
  <div id="results"></div>
  <script>
    'use strict';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(name, passed_, info) {
      const div = document.createElement('div');
      div.className = 'result ' + (passed_ ? 'pass' : 'fail');
      let text = (passed_ ? 'PASS' : 'FAIL') + ': ' + name;
      if (info) text += ' - ' + info;
      div.textContent = text;
      results.appendChild(div);
      if (passed_) passed++; else failed++;
    }

    function arraysMatch(a, b, tol) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (tol === 0) { if (a[i] !== b[i]) return false; }
        else { if (Math.abs(a[i] - b[i]) > tol) return false; }
      }
      return true;
    }

    async function runTests() {
      if (!navigator.ml) { log('WebNN API not available', false); showSummary(); return; }
      log('WebNN API available', true);
      if (!window.isSecureContext) { log('Not in secure context', false); showSummary(); return; }
      log('Secure context OK', true);

      let context;
      try {
        context = await navigator.ml.createContext({});
      } catch (e) {
        log('createContext', false, e.message);
        showSummary();
        return;
      }

      try {
        const b = new MLGraphBuilder(context);
        const d = { dataType: 'float32', shape: [4] };
        const x = b.input('x', d);
        const y = b.input('y', d);
        const z = b.input('z', d);
        const m = b.mul(x, y);
        const o = b.div(m, z);
        const g = await b.build({ o });
        const xT = await context.createTensor({ dataType: 'float32', shape: [4], writable: true, readable: false });
        const yT = await context.createTensor({ dataType: 'float32', shape: [4], writable: true, readable: false });
        const zT = await context.createTensor({ dataType: 'float32', shape: [4], writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: [4], writable: false, readable: true });
        context.writeTensor(xT, new Float32Array([1,2,3,4]));
        context.writeTensor(yT, new Float32Array([10,10,10,10]));
        context.writeTensor(zT, new Float32Array([2,4,5,8]));
        context.dispatch(g, { x: xT, y: yT, z: zT }, { o: oT });
        const buf = await context.readTensor(oT);
        const r = new Float32Array(buf);
        const exp = new Float32Array([5,5,6,5]);
        const ok = arraysMatch(r, exp, 1e-5);
        const s = `Got: [${Array.from(r).map(v => v.toFixed(1)).join(', ')}]`;
        if (ok) log('mul_div', true, s); else log('mul_div', false, `${s}, Expected: [5, 5, 6, 5]`);
        g.destroy(); xT.destroy(); yT.destroy(); zT.destroy(); oT.destroy();
      } catch (e) {
        log('mul_div', false, e.message);
      }

      context.destroy();
      showSummary();
    }

    function showSummary() {
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.textContent = 'Results: ' + passed + ' passed, ' + failed + ' failed';
      if (failed > 0 && !window.isSecureContext) {
        const note = document.createElement('div');
        note.style.color = 'orange';
        note.style.marginTop = '10px';
        note.textContent = 'Note: WebNN requires a secure context (HTTPS or localhost).';
        results.appendChild(note);
      }
      results.appendChild(summary);
    }

    runTests();
  </script>
</body>
</html>
