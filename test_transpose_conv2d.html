<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebNN Dispatch – transpose + conv2d</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>WebNN Dispatch – transpose + conv2d</h1>
  <p>Transpose NHWC [1,4,5,2] → NCHW [1,2,4,5], then conv2d with filter [3,2,2,2] OIHW.</p>
  <div id="results"></div>
  <script>
    'use strict';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(name, passed_, info) {
      const div = document.createElement('div');
      div.className = 'result ' + (passed_ ? 'pass' : 'fail');
      let text = (passed_ ? 'PASS' : 'FAIL') + ': ' + name;
      if (info) text += ' - ' + info;
      div.textContent = text;
      results.appendChild(div);
      if (passed_) passed++; else failed++;
    }

    async function runTests() {
      if (!navigator.ml) { log('WebNN API not available', false); showSummary(); return; }
      log('WebNN API available', true);
      if (!window.isSecureContext) { log('Not in secure context', false); showSummary(); return; }
      log('Secure context OK', true);

      let context;
      try {
        context = await navigator.ml.createContext({});
      } catch (e) {
        log('createContext', false, e.message);
        showSummary();
        return;
      }

      // transpose (NHWC→NCHW) + conv2d
      // Input: NHWC [1, 4, 5, 2] with sequential values
      // Transpose [0,3,1,2] → NCHW [1, 2, 4, 5]
      // Conv2d with filter [3, 2, 2, 2] OIHW, padding=[0,0,0,0], strides=[1,1]
      // Output: [1, 3, 3, 4]
      try {
        const N = 1, H = 4, W = 5, C = 2;
        const COUT = 3, HF = 2, WF = 2;
        const HOUT = H - HF + 1; // 3
        const WOUT = W - WF + 1; // 4

        // Build input NHWC: sequential values, input[n,h,w,c] = (h*W + w)*C + c
        const iD = { dataType: 'float32', shape: [N, H, W, C] };
        const nhwcInput = new Float32Array(N * H * W * C);
        for (let h = 0; h < H; h++) {
          for (let w = 0; w < W; w++) {
            for (let c = 0; c < C; c++) {
              nhwcInput[(h * W + w) * C + c] = (h * W + w) * C + c;
            }
          }
        }

        // Build filter OIHW: sequential values
        const fD = { dataType: 'float32', shape: [COUT, C, HF, WF] };
        const filterData = new Float32Array(COUT * C * HF * WF);
        for (let oc = 0; oc < COUT; oc++) {
          for (let ci = 0; ci < C; ci++) {
            for (let fh = 0; fh < HF; fh++) {
              for (let fw = 0; fw < WF; fw++) {
                const fIdx = ((oc * C + ci) * HF + fh) * WF + fw;
                filterData[fIdx] = ((oc * C + ci) * HF + fh) * WF + fw;
              }
            }
          }
        }

        // Manually compute expected output in NCHW layout
        const expected = new Float32Array(COUT * HOUT * WOUT);
        for (let oc = 0; oc < COUT; oc++) {
          for (let oh = 0; oh < HOUT; oh++) {
            for (let ow = 0; ow < WOUT; ow++) {
              let sum = 0;
              for (let ci = 0; ci < C; ci++) {
                for (let fh = 0; fh < HF; fh++) {
                  for (let fw = 0; fw < WF; fw++) {
                    const h = oh + fh;
                    const w = ow + fw;
                    // NCHW input value at [0, ci, h, w] = NHWC value at [0, h, w, ci]
                    const inpVal = (h * W + w) * C + ci;
                    const fIdx = ((oc * C + ci) * HF + fh) * WF + fw;
                    sum += inpVal * filterData[fIdx];
                  }
                }
              }
              expected[(oc * HOUT + oh) * WOUT + ow] = sum;
            }
          }
        }

        // Build and dispatch graph
        const b = new MLGraphBuilder(context);
        const x = b.input('x', iD);
        const t = b.transpose(x, { permutation: [0, 3, 1, 2] });
        const f = b.constant(fD, filterData);
        const o = b.conv2d(t, f, { padding: [0, 0, 0, 0], strides: [1, 1], inputLayout: 'nchw', filterLayout: 'oihw' });
        const g = await b.build({ o });

        const iT = await context.createTensor({ dataType: 'float32', shape: iD.shape, writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: o.shape, writable: false, readable: true });
        context.writeTensor(iT, nhwcInput);
        context.dispatch(g, { x: iT }, { o: oT });
        const buf = await context.readTensor(oT);
        const actual = new Float32Array(buf);

        const tol = 1e-5;
        const actualVals = Array.from(actual);
        const expVals = Array.from(expected);
        let allMatch = actualVals.length === expVals.length;
        if (allMatch) {
          for (let i = 0; i < expVals.length; i++) {
            if (Math.abs(actualVals[i] - expVals[i]) > tol) {
              allMatch = false;
              break;
            }
          }
        }
        const shapeOk = o.shape.length === 4 && o.shape[1] === COUT && o.shape[2] === HOUT && o.shape[3] === WOUT;
        log('transpose+conv2d', allMatch && shapeOk,
          `Shape: [${o.shape}], expected first 3: [${expVals.slice(0,3).map(v=>v.toFixed(1)).join(', ')}], got: [${actualVals.slice(0,3).map(v=>v.toFixed(1)).join(', ')}]`);
        g.destroy(); iT.destroy(); oT.destroy();
      } catch (e) {
        log('transpose+conv2d', false, e.message);
      }

      context.destroy();
      showSummary();
    }

    function showSummary() {
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.textContent = 'Results: ' + passed + ' passed, ' + failed + ' failed';
      if (failed > 0 && !window.isSecureContext) {
        const note = document.createElement('div');
        note.style.color = 'orange';
        note.style.marginTop = '10px';
        note.textContent = 'Note: WebNN requires a secure context (HTTPS or localhost).';
        results.appendChild(note);
      }
      results.appendChild(summary);
    }

    runTests();
  </script>
</body>
</html>
