<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebNN Dispatch – concat + conv2d</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>WebNN Dispatch – concat + conv2d</h1>
  <p>concat two [1,1,4,4] ones tensors on axis 1 → [1,2,4,4], then conv2d with [1,2,3,3] ones filter. Each output = 2*9 = 18. Expected: [18, 18, 18, 18].</p>
  <div id="results"></div>
  <script>
    'use strict';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(name, passed_, info) {
      const div = document.createElement('div');
      div.className = 'result ' + (passed_ ? 'pass' : 'fail');
      let text = (passed_ ? 'PASS' : 'FAIL') + ': ' + name;
      if (info) text += ' - ' + info;
      div.textContent = text;
      results.appendChild(div);
      if (passed_) passed++; else failed++;
    }

    function arraysMatch(a, b, tol) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (tol === 0) { if (a[i] !== b[i]) return false; }
        else { if (Math.abs(a[i] - b[i]) > tol) return false; }
      }
      return true;
    }

    async function runTests() {
      if (!navigator.ml) { log('WebNN API not available', false); showSummary(); return; }
      log('WebNN API available', true);
      if (!window.isSecureContext) { log('Not in secure context', false); showSummary(); return; }
      log('Secure context OK', true);

      let context;
      try {
        context = await navigator.ml.createContext({});
      } catch (e) {
        log('createContext', false, e.message);
        showSummary();
        return;
      }

      try {
        const b = new MLGraphBuilder(context);
        const cD = { dataType: 'float32', shape: [1, 1, 4, 4] };
        const fD = { dataType: 'float32', shape: [1, 2, 3, 3] };
        const a = b.input('a', cD);
        const b_ = b.input('b', cD);
        const f = b.input('f', fD);
        const cat = b.concat([a, b_], 1);
        const o = b.conv2d(cat, f, { padding: [0, 0, 0, 0], strides: [1, 1], inputLayout: 'nchw', filterLayout: 'oihw' });
        const g = await b.build({ o });
        const aT = await context.createTensor({ dataType: 'float32', shape: cD.shape, writable: true, readable: false });
        const bT = await context.createTensor({ dataType: 'float32', shape: cD.shape, writable: true, readable: false });
        const fT = await context.createTensor({ dataType: 'float32', shape: fD.shape, writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: o.shape, writable: false, readable: true });
        context.writeTensor(aT, new Float32Array(16).fill(1));
        context.writeTensor(bT, new Float32Array(16).fill(1));
        context.writeTensor(fT, new Float32Array(18).fill(1));
        context.dispatch(g, { a: aT, b: bT, f: fT }, { o: oT });
        const buf = await context.readTensor(oT);
        const r = new Float32Array(buf);
        const exp = new Float32Array(4).fill(18);
        const ok = arraysMatch(r, exp, 1e-5);
        const s = `Got: [${Array.from(r).map(v => v.toFixed(1)).join(', ')}]`;
        if (ok) log('concat_conv2d', true, s); else log('concat_conv2d', false, `${s}, Expected: [18, 18, 18, 18]`);
        g.destroy(); aT.destroy(); bT.destroy(); fT.destroy(); oT.destroy();
      } catch (e) {
        log('concat_conv2d', false, e.message);
      }

      context.destroy();
      showSummary();
    }

    function showSummary() {
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.textContent = 'Results: ' + passed + ' passed, ' + failed + ' failed';
      if (failed > 0 && !window.isSecureContext) {
        const note = document.createElement('div');
        note.style.color = 'orange';
        note.style.marginTop = '10px';
        note.textContent = 'Note: WebNN requires a secure context (HTTPS or localhost).';
        results.appendChild(note);
      }
      results.appendChild(summary);
    }

    runTests();
  </script>
</body>
</html>
