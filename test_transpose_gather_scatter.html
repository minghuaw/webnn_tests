<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebNN Dispatch – transpose via gather + scatter</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>WebNN Dispatch – transpose via gather + scatter</h1>
  <p>Simulate NHWC→NCHW permutation using gatherND, then verify with scatterND.</p>
  <div id="results"></div>
  <script>
    'use strict';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(name, passed_, info) {
      const div = document.createElement('div');
      div.className = 'result ' + (passed_ ? 'pass' : 'fail');
      let text = (passed_ ? 'PASS' : 'FAIL') + ': ' + name;
      if (info) text += ' - ' + info;
      div.textContent = text;
      results.appendChild(div);
      if (passed_) passed++; else failed++;
    }

    async function runTests() {
      if (!navigator.ml) { log('WebNN API not available', false); showSummary(); return; }
      log('WebNN API available', true);
      if (!window.isSecureContext) { log('Not in secure context', false); showSummary(); return; }
      log('Secure context OK', true);

      let context;
      try {
        context = await navigator.ml.createContext({});
      } catch (e) {
        log('createContext', false, e.message);
        showSummary();
        return;
      }

      const H = 4, W = 5, C = 3;
      const NHWC_FLAT = H * W * C; // 60
      const NCHW_FLAT = C * H * W; // 60

      // gatherND indices: for each NCHW position (c,h,w), store NHWC tuple [h,w,c]
      // output in NCHW order → indices[c*H*W + h*W + w] = [h, w, c]
      const gatherIndicesData = new Int32Array(NCHW_FLAT * 3);
      for (let c = 0; c < C; c++) {
        for (let h = 0; h < H; h++) {
          for (let w = 0; w < W; w++) {
            const idx = c * H * W + h * W + w;
            const off = idx * 3;
            gatherIndicesData[off + 0] = h;
            gatherIndicesData[off + 1] = w;
            gatherIndicesData[off + 2] = c;
          }
        }
      }

      // scatterND indices: for each NHWC position (h,w,c), store NCHW tuple [c,h,w]
      // target: for each NHWC flat position → NCHW tuple
      const scatterIndicesData = new Int32Array(NHWC_FLAT * 3);
      for (let h = 0; h < H; h++) {
        for (let w = 0; w < W; w++) {
          for (let c = 0; c < C; c++) {
            const idx = h * W * C + w * C + c;
            const off = idx * 3;
            scatterIndicesData[off + 0] = c;
            scatterIndicesData[off + 1] = h;
            scatterIndicesData[off + 2] = w;
          }
        }
      }

      // Input: sequential values 0..59 in NHWC [H, W, C] (batch dim handled separately)
      const inputData = new Float32Array(NHWC_FLAT);
      for (let i = 0; i < NHWC_FLAT; i++) inputData[i] = i;

      // ========== Test 1: gatherND-based NHWC→NCHW ==========
      // Input [H,W,C], gatherND with indices [CHW, 3] → [CHW], reshape → [C,H,W]
      // indices[CHW, 3]: last dim = 3 <= input rank 3 ✓
      try {
        const b = new MLGraphBuilder(context);
        const iD = { dataType: 'float32', shape: [H, W, C] };
        const x = b.input('x', iD);
        const idxOperand = b.constant({ dataType: 'int32', shape: [NCHW_FLAT, 3] }, gatherIndicesData);
        const gathered = b.gatherND(x, idxOperand);
        const out = b.reshape(gathered, [1, C, H, W]);
        const g = await b.build({ out });

        const iT = await context.createTensor({ dataType: 'float32', shape: iD.shape, writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: out.shape, writable: false, readable: true });
        context.writeTensor(iT, inputData);
        context.dispatch(g, { x: iT }, { out: oT });
        const buf = await context.readTensor(oT);
        const r = new Float32Array(buf);

        let allCorrect = true;
        for (let c = 0; c < C; c++) {
          for (let h = 0; h < H; h++) {
            for (let w = 0; w < W; w++) {
              const nchwIdx = c * H * W + h * W + w;
              const expected = h * W * C + w * C + c;
              if (Math.abs(r[nchwIdx] - expected) > 1e-5) {
                allCorrect = false; break;
              }
            }
            if (!allCorrect) break;
          }
          if (!allCorrect) break;
        }
        const shapeOk = out.shape[0]===1 && out.shape[1]===C && out.shape[2]===H && out.shape[3]===W;
        log('gatherND NHWC→NCHW', allCorrect && shapeOk,
          `Shape: [${out.shape}], first 6: [${Array.from(r.slice(0,6)).map(v=>v.toFixed(0)).join(',')}]`);
        g.destroy(); iT.destroy(); oT.destroy();
      } catch (e) {
        log('gatherND NHWC→NCHW', false, e.message);
      }

      // ========== Test 2: scatterND-based NHWC→NCHW ==========
      // Zero input [C,H,W], scatterND with indices [HWC, 3] → [C,H,W]
      // indices[HWC, 3]: last dim = 3 <= input rank 3 ✓
      try {
        const b = new MLGraphBuilder(context);
        const zero = b.constant({ dataType: 'float32', shape: [C, H, W] }, new Float32Array(NCHW_FLAT).fill(0));
        const idxOperand = b.constant({ dataType: 'int32', shape: [NHWC_FLAT, 3] }, scatterIndicesData);
        const updatesData = b.constant({ dataType: 'float32', shape: [NHWC_FLAT] }, inputData);
        const scattered = b.scatterND(zero, idxOperand, updatesData);
        const out = b.reshape(scattered, [1, C, H, W]);
        const g = await b.build({ out });

        const oT = await context.createTensor({ dataType: 'float32', shape: out.shape, writable: false, readable: true });
        context.dispatch(g, {}, { out: oT });
        const buf = await context.readTensor(oT);
        const r = new Float32Array(buf);

        let allCorrect = true;
        for (let c = 0; c < C; c++) {
          for (let h = 0; h < H; h++) {
            for (let w = 0; w < W; w++) {
              const nchwIdx = c * H * W + h * W + w;
              const expected = h * W * C + w * C + c;
              if (Math.abs(r[nchwIdx] - expected) > 1e-5) {
                allCorrect = false; break;
              }
            }
            if (!allCorrect) break;
          }
          if (!allCorrect) break;
        }
        const shapeOk = out.shape[0]===1 && out.shape[1]===C && out.shape[2]===H && out.shape[3]===W;
        log('scatterND NHWC→NCHW', allCorrect && shapeOk,
          `Shape: [${out.shape}], first 6: [${Array.from(r.slice(0,6)).map(v=>v.toFixed(0)).join(',')}]`);
        g.destroy(); oT.destroy();
      } catch (e) {
        log('scatterND NHWC→NCHW', false, e.message);
      }

      context.destroy();
      showSummary();
    }

    function showSummary() {
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.textContent = 'Results: ' + passed + ' passed, ' + failed + ' failed';
      if (failed > 0 && !window.isSecureContext) {
        const note = document.createElement('div');
        note.style.color = 'orange';
        note.style.marginTop = '10px';
        note.textContent = 'Note: WebNN requires a secure context (HTTPS or localhost).';
        results.appendChild(note);
      }
      results.appendChild(summary);
    }

    runTests();
  </script>
</body>
</html>
