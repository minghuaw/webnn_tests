<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebNN – conv2d no-padding test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>WebNN – conv2d no-padding test</h1>
  <p>conv2d [1,1,5,5] all-ones with [1,1,3,3] filter, no padding, stride=1 — all output values should be 9.</p>
  <div id="results"></div>
  <script>
    'use strict';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(name, passed_, info, timing) {
      const div = document.createElement('div');
      div.className = 'result ' + (passed_ ? 'pass' : 'fail');
      let text = (passed_ ? 'PASS' : 'FAIL') + ': ' + name;
      if (info) text += ' - ' + info;
      if (timing !== undefined) text += ` (${timing.toFixed(2)}ms)`;
      div.textContent = text;
      results.appendChild(div);
      if (passed_) passed++; else failed++;
    }

    async function runTests() {
      if (!navigator.ml) { log('WebNN API not available', false); showSummary(); return; }
      log('WebNN API available', true);
      if (!window.isSecureContext) { log('Not in secure context', false); showSummary(); return; }
      log('Secure context OK', true);

      let context;
      try {
        context = await navigator.ml.createContext({});
      } catch (e) {
        log('createContext', false, e.message);
        showSummary();
        return;
      }

      // Basic conv2d test (no padding)
      // Input: [1, 1, 5, 5] NCHW, all ones
      // Filter: [1, 1, 3, 3] all ones (constant)
      // Padding: [0, 0, 0, 0], Stride: [1, 1]
      // Output: floor((5-3)/1)+1 = 3 → [1, 1, 3, 3], each = 9
      try {
        const b = new MLGraphBuilder(context);
        const x = b.input('x', { dataType: 'float32', shape: [1, 1, 5, 5] });
        const f = b.constant({ dataType: 'float32', shape: [1, 1, 3, 3] }, new Float32Array(9).fill(1));
        const o = b.conv2d(x, f, { padding: [0, 0, 0, 0], strides: [1, 1], inputLayout: 'nchw', filterLayout: 'oihw' });
        const g = await b.build({ o });
        const xT = await context.createTensor({ dataType: 'float32', shape: [1, 1, 5, 5], writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: o.shape, writable: false, readable: true });
        context.writeTensor(xT, new Float32Array(25).fill(1));
        const t0 = performance.now();
        context.dispatch(g, { x: xT }, { o: oT });
        const buf = await context.readTensor(oT);
        const timing = performance.now() - t0;
        const r = new Float32Array(buf);
        const allOk = r.length === 9 && r.every(v => Math.abs(v - 9) < 1e-5);
        if (allOk) {
          log('conv2d_nopad', true, `Output: [${o.shape}], all 9.0`, timing);
        } else {
          log('conv2d_nopad', false,
            `Got: [${Array.from(r).map(v => v.toFixed(1)).join(', ')}], expected all 9.0`, timing);
        }
        g.destroy(); xT.destroy(); oT.destroy();
      } catch (e) {
        log('conv2d_nopad', false, e.message);
      }

      context.destroy();
      showSummary();
    }

    function showSummary() {
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.textContent = 'Results: ' + passed + ' passed, ' + failed + ' failed';
      if (failed > 0 && !window.isSecureContext) {
        const note = document.createElement('div');
        note.style.color = 'orange';
        note.style.marginTop = '10px';
        note.textContent = 'Note: WebNN requires a secure context (HTTPS or localhost).';
        results.appendChild(note);
      }
      results.appendChild(summary);
    }

    runTests();
  </script>
</body>
</html>
