<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebNN Dispatch – dequantizeLinear + relu</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>WebNN Dispatch – dequantizeLinear + relu</h1>
  <p>dequantizeLinear uint8 [0, 128, 200] with scale=0.1, zeroPoint=128 -> [-12.8, 0, 7.2], then relu. Expected: [0, 0, 7.2] (tolerance 1e-4).</p>
  <div id="results"></div>
  <script>
    'use strict';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(name, passed_, info) {
      const div = document.createElement('div');
      div.className = 'result ' + (passed_ ? 'pass' : 'fail');
      let text = (passed_ ? 'PASS' : 'FAIL') + ': ' + name;
      if (info) text += ' - ' + info;
      div.textContent = text;
      results.appendChild(div);
      if (passed_) passed++; else failed++;
    }

    function arraysMatch(a, b, tol) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (tol === 0) { if (a[i] !== b[i]) return false; }
        else { if (Math.abs(a[i] - b[i]) > tol) return false; }
      }
      return true;
    }

    async function runTests() {
      if (!navigator.ml) { log('WebNN API not available', false); showSummary(); return; }
      log('WebNN API available', true);
      if (!window.isSecureContext) { log('Not in secure context', false); showSummary(); return; }
      log('Secure context OK', true);

      let context;
      try {
        context = await navigator.ml.createContext({});
      } catch (e) {
        log('createContext', false, e.message);
        showSummary();
        return;
      }

      try {
        const b = new MLGraphBuilder(context);
        const x = b.input('x', { dataType: 'uint8', shape: [3] });
        const scale = b.input('scale', { dataType: 'float32', shape: [1] });
        const zp = b.input('zp', { dataType: 'uint8', shape: [1] });
        const dq = b.dequantizeLinear(x, scale, zp);
        const o = b.relu(dq);
        const g = await b.build({ o });
        const xT = await context.createTensor({ dataType: 'uint8', shape: [3], writable: true, readable: false });
        const sT = await context.createTensor({ dataType: 'float32', shape: [1], writable: true, readable: false });
        const zT = await context.createTensor({ dataType: 'uint8', shape: [1], writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: [3], writable: false, readable: true });
        context.writeTensor(xT, new Uint8Array([0, 128, 200]));
        context.writeTensor(sT, new Float32Array([0.1]));
        context.writeTensor(zT, new Uint8Array([128]));
        context.dispatch(g, { x: xT, scale: sT, zp: zT }, { o: oT });
        const buf = await context.readTensor(oT);
        const r = new Float32Array(buf);
        const exp = new Float32Array([0, 0, 7.2]);
        const ok = arraysMatch(r, exp, 1e-4);
        const s = `Got: [${Array.from(r).map(v => v.toFixed(4)).join(', ')}]`;
        if (ok) log('dequantizeLinear_relu', true, s); else log('dequantizeLinear_relu', false, s + ', Expected: [0, 0, 7.2000]');
        g.destroy(); xT.destroy(); sT.destroy(); zT.destroy(); oT.destroy();
      } catch (e) {
        log('dequantizeLinear_relu', false, e.message);
      }

      context.destroy();
      showSummary();
    }

    function showSummary() {
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.textContent = 'Results: ' + passed + ' passed, ' + failed + ' failed';
      if (failed > 0 && !window.isSecureContext) {
        const note = document.createElement('div');
        note.style.color = 'orange';
        note.style.marginTop = '10px';
        note.textContent = 'Note: WebNN requires a secure context (HTTPS or localhost).';
        results.appendChild(note);
      }
      results.appendChild(summary);
    }

    runTests();
  </script>
</body>
</html>
