<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebNN Dispatch – batchNormalization + relu</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>WebNN Dispatch – batchNormalization + relu</h1>
  <p>batchNormalization (mean=0, var=1, axis=1) on [1,2,2,2] with values [-2,-1,0,1] per channel, then relu. Expected: [0,0,0,1, 0,0,0,1] (tolerance 1e-2).</p>
  <div id="results"></div>
  <script>
    'use strict';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(name, passed_, info, timing) {
      const div = document.createElement('div');
      div.className = 'result ' + (passed_ ? 'pass' : 'fail');
      let text = (passed_ ? 'PASS' : 'FAIL') + ': ' + name;
      if (info) text += ' - ' + info;
      if (timing !== undefined) text += ' (' + timing.toFixed(2) + 'ms)';
      div.textContent = text;
      results.appendChild(div);
      if (passed_) passed++; else failed++;
    }

    function arraysMatch(a, b, tol) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (tol === 0) { if (a[i] !== b[i]) return false; }
        else { if (Math.abs(a[i] - b[i]) > tol) return false; }
      }
      return true;
    }

    async function runTests() {
      if (!navigator.ml) { log('WebNN API not available', false); showSummary(); return; }
      log('WebNN API available', true);
      if (!window.isSecureContext) { log('Not in secure context', false); showSummary(); return; }
      log('Secure context OK', true);

      let context;
      try {
        context = await navigator.ml.createContext({});
      } catch (e) {
        log('createContext', false, e.message);
        showSummary();
        return;
      }

      try {
        const b = new MLGraphBuilder(context);
        const iD = { dataType: 'float32', shape: [1, 2, 2, 2] };
        const x = b.input('x', iD);
        const mean = b.input('mean', { dataType: 'float32', shape: [2] });
        const variance = b.input('variance', { dataType: 'float32', shape: [2] });
        const bn = b.batchNormalization(x, mean, variance, { axis: 1, epsilon: 1e-5 });
        const o = b.relu(bn);
        const g = await b.build({ o });
        const iT = await context.createTensor({ dataType: 'float32', shape: iD.shape, writable: true, readable: false });
        const mT = await context.createTensor({ dataType: 'float32', shape: [2], writable: true, readable: false });
        const vT = await context.createTensor({ dataType: 'float32', shape: [2], writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: o.shape, writable: false, readable: true });
        context.writeTensor(iT, new Float32Array([-2,-1,0,1, -2,-1,0,1]));
        context.writeTensor(mT, new Float32Array([0, 0]));
        context.writeTensor(vT, new Float32Array([1, 1]));
        const t0 = performance.now();
        context.dispatch(g, { x: iT, mean: mT, variance: vT }, { o: oT });
        const buf = await context.readTensor(oT);
        const timing = performance.now() - t0;
        const r = new Float32Array(buf);
        const exp = new Float32Array([0,0,0,1, 0,0,0,1]);
        const ok = arraysMatch(r, exp, 1e-2);
        const s = `Got: [${Array.from(r).map(v => v.toFixed(4)).join(', ')}]`;
        if (ok) log('batchNorm_relu', true, s, timing); else log('batchNorm_relu', false, `${s}, Expected: [0, 0, 0, 1, 0, 0, 0, 1]`, timing);
        g.destroy(); iT.destroy(); mT.destroy(); vT.destroy(); oT.destroy();
      } catch (e) {
        log('batchNorm_relu', false, e.message);
      }

      context.destroy();
      showSummary();
    }

    function showSummary() {
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.textContent = 'Results: ' + passed + ' passed, ' + failed + ' failed';
      if (failed > 0 && !window.isSecureContext) {
        const note = document.createElement('div');
        note.style.color = 'orange';
        note.style.marginTop = '10px';
        note.textContent = 'Note: WebNN requires a secure context (HTTPS or localhost).';
        results.appendChild(note);
      }
      results.appendChild(summary);
    }

    runTests();
  </script>
</body>
</html>
