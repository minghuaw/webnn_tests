<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebNN Dispatch – convTranspose2d + relu</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>WebNN Dispatch – convTranspose2d + relu</h1>
  <p>convTranspose2d on [1,1,2,2] with [1,1,2,2] ones filter, then relu. Expected: [1, 3, 2, 4, 10, 6, 3, 7, 4] (all positive, relu is identity).</p>
  <div id="results"></div>
  <script>
    'use strict';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(name, passed_, info, timing) {
      const div = document.createElement('div');
      div.className = 'result ' + (passed_ ? 'pass' : 'fail');
      let text = (passed_ ? 'PASS' : 'FAIL') + ': ' + name;
      if (info) text += ' - ' + info;
      if (timing !== undefined) text += ' (' + timing.toFixed(2) + 'ms)';
      div.textContent = text;
      results.appendChild(div);
      if (passed_) passed++; else failed++;
    }

    function arraysMatch(a, b, tol) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (tol === 0) { if (a[i] !== b[i]) return false; }
        else { if (Math.abs(a[i] - b[i]) > tol) return false; }
      }
      return true;
    }

    async function runTests() {
      if (!navigator.ml) { log('WebNN API not available', false); showSummary(); return; }
      log('WebNN API available', true);
      if (!window.isSecureContext) { log('Not in secure context', false); showSummary(); return; }
      log('Secure context OK', true);

      let context;
      try {
        context = await navigator.ml.createContext({});
      } catch (e) {
        log('createContext', false, e.message);
        showSummary();
        return;
      }

      try {
        const b = new MLGraphBuilder(context);
        const iD = { dataType: 'float32', shape: [1, 1, 2, 2] };
        const fD = { dataType: 'float32', shape: [1, 1, 2, 2] };
        const x = b.input('x', iD);
        const f = b.input('f', fD);
        const ct = b.convTranspose2d(x, f, { strides: [1, 1], inputLayout: 'nchw', filterLayout: 'iohw' });
        const o = b.relu(ct);
        const g = await b.build({ o });
        const iT = await context.createTensor({ dataType: 'float32', shape: iD.shape, writable: true, readable: false });
        const fT = await context.createTensor({ dataType: 'float32', shape: fD.shape, writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: o.shape, writable: false, readable: true });
        context.writeTensor(iT, new Float32Array([1, 2, 3, 4]));
        context.writeTensor(fT, new Float32Array(4).fill(1));
        const t0 = performance.now();
        context.dispatch(g, { x: iT, f: fT }, { o: oT });
        const buf = await context.readTensor(oT);
        const timing = performance.now() - t0;
        const r = new Float32Array(buf);
        const exp = new Float32Array([1, 3, 2, 4, 10, 6, 3, 7, 4]);
        const ok = arraysMatch(r, exp, 1e-5);
        const s = `Got: [${Array.from(r).map(v => v.toFixed(1)).join(', ')}]`;
        if (ok) log('convTranspose2d_relu', true, s, timing); else log('convTranspose2d_relu', false, `${s}, Expected: [1, 3, 2, 4, 10, 6, 3, 7, 4]`, timing);
        g.destroy(); iT.destroy(); fT.destroy(); oT.destroy();
      } catch (e) {
        log('convTranspose2d_relu', false, e.message);
      }

      context.destroy();
      showSummary();
    }

    function showSummary() {
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.textContent = 'Results: ' + passed + ' passed, ' + failed + ' failed';
      if (failed > 0 && !window.isSecureContext) {
        const note = document.createElement('div');
        note.style.color = 'orange';
        note.style.marginTop = '10px';
        note.textContent = 'Note: WebNN requires a secure context (HTTPS or localhost).';
        results.appendChild(note);
      }
      results.appendChild(summary);
    }

    runTests();
  </script>
</body>
</html>
