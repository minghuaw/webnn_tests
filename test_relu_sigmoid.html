<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebNN Dispatch – relu + sigmoid</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>WebNN Dispatch – relu + sigmoid</h1>
  <p>relu on [-2, -1, 0, 1, 2], then sigmoid on result. Negatives become 0; sigmoid squashes [0, 1, 2] → [0.5, 0.7311, 0.8808]. Expected: [0.5, 0.5, 0.5, 0.7311, 0.8808].</p>
  <div id="results"></div>
  <script>
    'use strict';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(name, passed_, info) {
      const div = document.createElement('div');
      div.className = 'result ' + (passed_ ? 'pass' : 'fail');
      let text = (passed_ ? 'PASS' : 'FAIL') + ': ' + name;
      if (info) text += ' - ' + info;
      div.textContent = text;
      results.appendChild(div);
      if (passed_) passed++; else failed++;
    }

    function arraysMatch(a, b, tol) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) {
        if (tol === 0) { if (a[i] !== b[i]) return false; }
        else { if (Math.abs(a[i] - b[i]) > tol) return false; }
      }
      return true;
    }

    async function runTests() {
      if (!navigator.ml) { log('WebNN API not available', false); showSummary(); return; }
      log('WebNN API available', true);
      if (!window.isSecureContext) { log('Not in secure context', false); showSummary(); return; }
      log('Secure context OK', true);

      let context;
      try {
        context = await navigator.ml.createContext({});
      } catch (e) {
        log('createContext', false, e.message);
        showSummary();
        return;
      }

      try {
        const b = new MLGraphBuilder(context);
        const d = { dataType: 'float32', shape: [5] };
        const x = b.input('x', d);
        const r = b.relu(x);
        const o = b.sigmoid(r);
        const g = await b.build({ o });
        const iT = await context.createTensor({ dataType: 'float32', shape: [5], writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: o.shape, writable: false, readable: true });
        context.writeTensor(iT, new Float32Array([-2, -1, 0, 1, 2]));
        context.dispatch(g, { x: iT }, { o: oT });
        const buf = await context.readTensor(oT);
        const r_ = new Float32Array(buf);
        const exp = new Float32Array([0.5, 0.5, 0.5, 0.7311, 0.8808]);
        const ok = arraysMatch(r_, exp, 2e-2);
        const s = `Got: [${Array.from(r_).map(v => v.toFixed(4)).join(', ')}]`;
        if (ok) log('relu_sigmoid', true, s); else log('relu_sigmoid', false, `${s}, Expected: [0.5000, 0.5000, 0.5000, 0.7311, 0.8808]`);
        g.destroy(); iT.destroy(); oT.destroy();
      } catch (e) {
        log('relu_sigmoid', false, e.message);
      }

      context.destroy();
      showSummary();
    }

    function showSummary() {
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.textContent = 'Results: ' + passed + ' passed, ' + failed + ' failed';
      if (failed > 0 && !window.isSecureContext) {
        const note = document.createElement('div');
        note.style.color = 'orange';
        note.style.marginTop = '10px';
        note.textContent = 'Note: WebNN requires a secure context (HTTPS or localhost).';
        results.appendChild(note);
      }
      results.appendChild(summary);
    }

    runTests();
  </script>
</body>
</html>
