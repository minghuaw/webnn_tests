<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebNN Dispatch – transpose</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    .pass { color: green; }
    .fail { color: red; }
    .result { margin: 5px 0; }
  </style>
</head>
<body>
  <h1>WebNN Dispatch – transpose</h1>
  <p>NHWC↔NCHW layout transforms and 2-axis swap transpose.</p>
  <div id="results"></div>
  <script>
    'use strict';

    const results = document.getElementById('results');
    let passed = 0;
    let failed = 0;

    function log(name, passed_, info) {
      const div = document.createElement('div');
      div.className = 'result ' + (passed_ ? 'pass' : 'fail');
      let text = (passed_ ? 'PASS' : 'FAIL') + ': ' + name;
      if (info) text += ' - ' + info;
      div.textContent = text;
      results.appendChild(div);
      if (passed_) passed++; else failed++;
    }

    async function runTests() {
      if (!navigator.ml) { log('WebNN API not available', false); showSummary(); return; }
      log('WebNN API available', true);
      if (!window.isSecureContext) { log('Not in secure context', false); showSummary(); return; }
      log('Secure context OK', true);

      let context;
      try {
        context = await navigator.ml.createContext({});
      } catch (e) {
        log('createContext', false, e.message);
        showSummary();
        return;
      }

      // Test 1: NHWC → NCHW
      // Input: NHWC [1, 4, 5, 3] filled with sequential values 0,1,2,...,59
      // Permutation: [0, 3, 1, 2] → NCHW [1, 3, 4, 5]
      try {
        const b = new MLGraphBuilder(context);
        const iD = { dataType: 'float32', shape: [1, 4, 5, 3] };
        const x = b.input('x', iD);
        const t = b.transpose(x, { permutation: [0, 3, 1, 2] });
        const g = await b.build({ t });
        const iT = await context.createTensor({ dataType: 'float32', shape: iD.shape, writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: t.shape, writable: false, readable: true });
        const inputData = new Float32Array(60);
        for (let i = 0; i < 60; i++) inputData[i] = i;
        context.writeTensor(iT, inputData);
        context.dispatch(g, { x: iT }, { t: oT });
        const buf = await context.readTensor(oT);
        const r = new Float32Array(buf);
        // NCHW [1, 3, 4, 5]: at [0, c, h, w] should equal NHWC [0, h, w, c]
        // NHWC [0, h, w, c] = ((h * 5) + w) * 3 + c
        // NCHW [0, c, h, w] = ((c * 4) + h) * 5 + w
        let allCorrect = true;
        for (let c = 0; c < 3; c++) {
          for (let h = 0; h < 4; h++) {
            for (let w = 0; w < 5; w++) {
              const nchwIdx = c * 20 + h * 5 + w;
              const expected = ((h * 5) + w) * 3 + c;
              if (Math.abs(r[nchwIdx] - expected) > 1e-5) {
                allCorrect = false;
                break;
              }
            }
            if (!allCorrect) break;
          }
          if (!allCorrect) break;
        }
        const shapeOk = t.shape.length === 4 && t.shape[1] === 3 && t.shape[2] === 4 && t.shape[3] === 5;
        const firstFew = Array.from(r.slice(0, 6)).map(v => v.toFixed(0));
        log('NHWC→NCHW transpose', allCorrect && shapeOk,
          `Shape: [${t.shape}], first 6: [${firstFew.join(', ')}]`);
        g.destroy(); iT.destroy(); oT.destroy();
      } catch (e) {
        log('NHWC→NCHW transpose', false, e.message);
      }

      // Test 2: NCHW → NHWC
      // Input: NCHW [1, 3, 4, 5] filled with sequential values 0,1,2,...,59
      // Permutation: [0, 2, 3, 1] → NHWC [1, 4, 5, 3]
      try {
        const b = new MLGraphBuilder(context);
        const iD = { dataType: 'float32', shape: [1, 3, 4, 5] };
        const x = b.input('x', iD);
        const t = b.transpose(x, { permutation: [0, 2, 3, 1] });
        const g = await b.build({ t });
        const iT = await context.createTensor({ dataType: 'float32', shape: iD.shape, writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: t.shape, writable: false, readable: true });
        const inputData = new Float32Array(60);
        for (let i = 0; i < 60; i++) inputData[i] = i;
        context.writeTensor(iT, inputData);
        context.dispatch(g, { x: iT }, { t: oT });
        const buf = await context.readTensor(oT);
        const r = new Float32Array(buf);
        // NHWC [1, 4, 5, 3]: at [0, h, w, c] should equal NCHW [0, c, h, w]
        // NCHW [0, c, h, w] = ((c * 4) + h) * 5 + w
        // NHWC [0, h, w, c] = ((h * 5) + w) * 3 + c
        let allCorrect = true;
        for (let h = 0; h < 4; h++) {
          for (let w = 0; w < 5; w++) {
            for (let c = 0; c < 3; c++) {
              const nhwcIdx = h * 15 + w * 3 + c;
              const expected = ((c * 4) + h) * 5 + w;
              if (Math.abs(r[nhwcIdx] - expected) > 1e-5) {
                allCorrect = false;
                break;
              }
            }
            if (!allCorrect) break;
          }
          if (!allCorrect) break;
        }
        const shapeOk = t.shape.length === 4 && t.shape[1] === 4 && t.shape[2] === 5 && t.shape[3] === 3;
        const firstFew = Array.from(r.slice(0, 6)).map(v => v.toFixed(0));
        log('NCHW→NHWC transpose', allCorrect && shapeOk,
          `Shape: [${t.shape}], first 6: [${firstFew.join(', ')}]`);
        g.destroy(); iT.destroy(); oT.destroy();
      } catch (e) {
        log('NCHW→NHWC transpose', false, e.message);
      }

      // Test 3: swap two axes only (axis 1 ↔ axis 2)
      // Input: [2, 3, 4, 5] filled with sequential values 0..119
      // Permutation: [0, 2, 1, 3] → [2, 4, 3, 5]
      try {
        const N = 2, A = 3, B = 4, C = 5;
        const b = new MLGraphBuilder(context);
        const iD = { dataType: 'float32', shape: [N, A, B, C] };
        const x = b.input('x', iD);
        const t = b.transpose(x, { permutation: [0, 2, 1, 3] });
        const g = await b.build({ t });
        const iT = await context.createTensor({ dataType: 'float32', shape: iD.shape, writable: true, readable: false });
        const oT = await context.createTensor({ dataType: 'float32', shape: t.shape, writable: false, readable: true });
        const inputData = new Float32Array(N * A * B * C);
        for (let i = 0; i < inputData.length; i++) inputData[i] = i;
        context.writeTensor(iT, inputData);
        context.dispatch(g, { x: iT }, { t: oT });
        const buf = await context.readTensor(oT);
        const r = new Float32Array(buf);
        let allCorrect = true;
        // output shape [N, B, A, C] = [2, 4, 3, 5]
        // input [n, a, b, c] = ((n*A + a)*B + b)*C + c
        // output[n, b, a, c] = ((n*B + b)*A + a)*C + c  (same value after swap)
        for (let n = 0; n < N; n++) {
          for (let b = 0; b < B; b++) {
            for (let a = 0; a < A; a++) {
              for (let c = 0; c < C; c++) {
                const outIdx = ((n * B + b) * A + a) * C + c;
                const expected = ((n * A + a) * B + b) * C + c;
                if (Math.abs(r[outIdx] - expected) > 1e-5) {
                  allCorrect = false;
                  break;
                }
              }
              if (!allCorrect) break;
            }
            if (!allCorrect) break;
          }
          if (!allCorrect) break;
        }
        const shapeOk = t.shape.length === 4 && t.shape[1] === B && t.shape[2] === A && t.shape[3] === C;
        const firstFew = Array.from(r.slice(0, 6)).map(v => v.toFixed(0));
        log('swap axes 1↔2 ([2,3,4,5]→[2,4,3,5])', allCorrect && shapeOk,
          `Shape: [${t.shape}], first 6: [${firstFew.join(', ')}]`);
        g.destroy(); iT.destroy(); oT.destroy();
      } catch (e) {
        log('swap axes 1↔2', false, e.message);
      }

      context.destroy();
      showSummary();
    }

    function showSummary() {
      const summary = document.createElement('div');
      summary.style.marginTop = '20px';
      summary.style.fontWeight = 'bold';
      summary.textContent = 'Results: ' + passed + ' passed, ' + failed + ' failed';
      if (failed > 0 && !window.isSecureContext) {
        const note = document.createElement('div');
        note.style.color = 'orange';
        note.style.marginTop = '10px';
        note.textContent = 'Note: WebNN requires a secure context (HTTPS or localhost).';
        results.appendChild(note);
      }
      results.appendChild(summary);
    }

    runTests();
  </script>
</body>
</html>
